name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.5.1'
      - name: Install locked API dependencies
        working-directory: api-server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build a windowed single-file EXE
        run: python -m PyInstaller --noconfirm assistant.spec
      - uses: actions/upload-artifact@v4
        with:
          name: NeteaseMusicAssistant-Windows-x64
          path: dist/NeteaseMusicAssistant.exe
          if-no-files-found: error
